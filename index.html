<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Wulff 赤平投影工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: two floating cards on a soft system background — the net on the left, controls on the right (Apple-style). */
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sec:#6e6e73; --ter:#aeaeb2; --sep:rgba(60,60,67,.13);
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07); --segon:#ffffff;
  --blue:#007aff; --tint:rgba(0,122,255,.10); --green:#34c759; --sel:#ff2d55; --sym:#5856d6;
  --g-minor:rgba(60,60,67,.09); --g-major:rgba(60,60,67,.24);
  --c0:#ff3b30; --c1:#007aff; --c2:#34c759; --c3:#ff9500; --c4:#af52de; --c5:#a2845e; --c6:#30b0c7; --c7:#5856d6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --sec:#98989d; --ter:#636366; --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14); --segon:#636366;
  --blue:#0a84ff; --tint:rgba(10,132,255,.18); --green:#30d158; --sel:#ff375f; --sym:#7d7aff;
  --g-minor:rgba(235,235,245,.08); --g-major:rgba(235,235,245,.22);
  --c0:#ff453a; --c1:#0a84ff; --c2:#30d158; --c3:#ff9f0a; --c4:#bf5af2; --c5:#ac8e68; --c6:#40c8e0; --c7:#7d7aff;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --sec:#98989d; --ter:#636366; --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14); --segon:#636366;
  --blue:#0a84ff; --tint:rgba(10,132,255,.18); --green:#30d158; --sel:#ff375f; --sym:#7d7aff;
  --g-minor:rgba(235,235,245,.08); --g-major:rgba(235,235,245,.22);
  --c0:#ff453a; --c1:#0a84ff; --c2:#30d158; --c3:#ff9f0a; --c4:#bf5af2; --c5:#ac8e68; --c6:#40c8e0; --c7:#7d7aff;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1280px;margin:0 auto 18px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top p{margin:4px 0 0;color:var(--sec);font-size:15px}
.top .sp{flex:1}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:980px){.app{grid-template-columns:minmax(0,1.2fr) minmax(360px,1fr)}.stage{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start}}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.stage{padding:16px;display:flex;flex-direction:column;gap:12px}
.panel{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.seg.inline{display:inline-flex}
.btn{border:0;border-radius:980px;padding:7px 16px;background:var(--tint);color:var(--blue);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn.pri{background:var(--blue);color:#fff}
.btn.plain{background:transparent;padding:7px 8px}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.tile:focus-visible,.in:focus-visible,.sw:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border:0;border-radius:12px;background:var(--fill2);padding:11px 8px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink)}
.tile:hover:not(:disabled){background:var(--fill)}
.tile:disabled{color:var(--ter);cursor:default}
.in{border:0;background:var(--fill);border-radius:10px;padding:8px 11px;min-width:0;font-variant-numeric:tabular-nums}
.in::placeholder{color:var(--ter)}
.w-s{width:4.6em}.w-m{width:6.2em}.grow{flex:1;min-width:5em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:13px;color:var(--sec)}
.sec-h{font-size:13px;font-weight:600;color:var(--sec);letter-spacing:.01em;margin:0 0 8px}
.group{display:flex;flex-direction:column}
.swl{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:25px;border-radius:999px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(17px)}
input[type=range]{accent-color:var(--blue)}
.cwrap{position:relative;width:100%;max-width:min(100%,calc(100vh - 200px));min-width:min(100%,300px);margin:0 auto;aspect-ratio:1/1}
@media (max-width:979px){.cwrap{max-width:100%}}
#net,#cv3{position:absolute;inset:0;width:100%;height:100%;display:block}
#net{touch-action:manipulation;cursor:crosshair;user-select:none}
#cv3{touch-action:none;cursor:grab}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.bar input[type=range]{flex:1;min-width:120px;max-width:260px}
.foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--sec);min-height:24px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--fill2);border-radius:999px;padding:2px 9px;font-size:13px;color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.ob{text-decoration:overline}
.ex-title{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px}
.given{font-size:13.5px;color:var(--sec)}
.steps{list-style:none;margin:0;padding:0;border-radius:12px;background:var(--fill2);overflow:hidden}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;font-size:14.5px;position:relative}
.steps li+li::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:.5px solid var(--sep)}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;border:1.5px solid var(--ter);color:var(--sec)}
.steps li.done .n{border-color:transparent;background:var(--fill);color:var(--sec)}
.steps li.cur .n{border-color:var(--blue);background:var(--blue);color:#fff}
.steps li.cur{font-weight:600}
.note{font-size:14.5px;margin:0}
.ans{border-radius:12px;background:var(--tint);padding:10px 14px;font-size:14.5px}
.ans b{color:var(--blue);font-weight:600;margin-right:8px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1;padding:10px}
.result{font-size:14px;display:flex;flex-direction:column;gap:6px}
.result div{padding:8px 12px;border-radius:10px;background:var(--fill2)}
.result div:first-child{background:var(--tint)}
.forms{display:flex;flex-direction:column;border-radius:12px;background:var(--fill2);overflow:hidden}
.forms .f{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:14px;position:relative}
.forms .f+.f::before{content:"";position:absolute;top:0;left:31px;right:0;border-top:.5px solid var(--sep)}
.forms .f .nm{flex:1;min-width:0}
.forms .f .nm small{color:var(--sec);margin-left:6px}
.x{border:0;background:transparent;color:var(--ter);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.muted{color:var(--sec)}
svg text{font-family:var(--font)}
</style>

<header class="top">
  <div>
    <h1>赤平投影</h1>
    <p>網固定、轉描圖紙 · Φ 從東（b 軸）起算，ρ 從圓心起算</p>
  </div>
  <span class="sp"></span>
  <button class="btn" id="undoBtn">復原</button>
  <button class="btn" id="clearBtn">清除</button>
</header>

<main class="app">
  <section class="card stage" aria-label="投影圖">
    <div class="seg inline" role="tablist" id="viewSeg" style="align-self:center">
      <button role="tab" data-view="net" aria-selected="true">赤平投影</button>
      <button role="tab" data-view="3d" aria-selected="false">3D 球面</button>
    </div>
    <div class="cwrap" id="wrapNet"><svg id="net" viewBox="-410 -410 820 820" role="img" aria-label="Wulff net"></svg></div>
    <div class="cwrap" id="wrap3d" hidden><canvas id="cv3" aria-label="3D 球面投影"></canvas></div>
    <div class="bar" id="barNet">
      <span class="lab">描圖紙轉角</span>
      <input type="range" id="netRot" min="-180" max="180" step="0.5" value="0" aria-label="描圖紙轉角（正值為逆時針）">
      <span class="num" id="netRotVal" style="min-width:6.5em">0°</span>
      <button class="btn" id="netAlign">對齊所選</button>
      <label class="swl"><input type="checkbox" class="sw" id="clickAdd"> 點擊加點</label>
    </div>
    <div class="bar" id="bar3d" hidden>
      <label class="swl"><input type="checkbox" class="sw" data-o3="crystal" checked> 晶體</label>
      <label class="swl"><input type="checkbox" class="sw" data-o3="rays" checked> 投影射線</label>
      <span style="flex:1"></span>
      <button class="btn" id="v3top">俯視</button>
      <button class="btn" id="v3def">重設</button>
    </div>
    <div class="foot" id="status"></div>
  </section>

  <aside class="card panel" aria-label="控制">
    <div class="seg" role="tablist" id="paneSeg">
      <button role="tab" data-pane="ex" aria-selected="true">練習</button>
      <button role="tab" data-pane="con" aria-selected="false">作圖</button>
      <button role="tab" data-pane="cry" aria-selected="false">晶體</button>
    </div>

    <div id="pane-ex" class="group" style="gap:14px">
      <select id="exSel" class="in" aria-label="選擇練習"></select>
      <div>
        <div class="ex-title" id="exTitle"></div>
        <div class="given" id="exGiven"></div>
      </div>
      <ol class="steps" id="exSteps"></ol>
      <p class="note" id="exNote"></p>
      <div class="ans" id="exAns" hidden></div>
      <div class="nav">
        <button class="btn" id="exPrev">上一步</button>
        <button class="btn pri" id="exNext">下一步</button>
      </div>
    </div>

    <div id="pane-con" class="group" style="gap:20px" hidden>
      <div class="group">
        <h3 class="sec-h">新增</h3>
        <div class="row">
          <input id="ptLab" class="in w-s" placeholder="名稱">
          <input id="ptPhi" class="in grow" placeholder="Φ">
          <input id="ptRho" class="in grow" placeholder="ρ">
          <button class="btn pri" id="ptAdd">加點</button>
        </div>
        <div class="row" style="margin-top:8px">
          <input id="hklIn" class="in grow" placeholder="(hkl)，例如 111、1-10">
          <button class="btn" id="hklAdd">加晶面</button>
        </div>
      </div>
      <div class="group">
        <h3 class="sec-h">作圖 <span class="muted" id="selHint" style="font-weight:400"></span></h3>
        <div class="tiles">
          <button class="tile" data-act="gc2" title="選 2 點">大圓</button>
          <button class="tile" data-act="angle" title="選 2 點">夾角</button>
          <button class="tile" data-act="zone" title="選 2 點">晶帶軸</button>
          <button class="tile" data-act="gcOfPole" title="選 1 點">極的大圓</button>
          <button class="tile" data-act="sc" title="選 1 點">小圓</button>
          <button class="tile" data-act="x" title="選 2 個圓">交點</button>
          <button class="tile" data-act="anti" title="選 1 點">Antipole</button>
          <button class="tile" data-act="toPrim" title="選 2 點">轉到基圓</button>
          <button class="tile" data-act="rotate" title="選點">旋轉</button>
        </div>
        <div class="row" style="margin-top:10px">
          <span class="lab">小圓半徑</span><input id="scR" class="in w-s" value="40">
          <span class="lab">旋轉角</span><input id="rotDeg" class="in w-s" value="30">
          <span style="flex:1"></span>
          <button class="btn plain" id="delSel">刪除所選</button>
        </div>
      </div>
      <div class="group">
        <h3 class="sec-h">結果</h3>
        <div class="result" id="result"></div>
      </div>
    </div>

    <div id="pane-cry" class="group" style="gap:20px" hidden>
      <div class="group">
        <h3 class="sec-h">晶系</h3>
        <div class="row">
          <select id="sysSel" class="in grow" aria-label="晶系"></select>
          <select id="pgSel" class="in" aria-label="點群"></select>
        </div>
        <div class="row" id="latInputs" style="margin-top:8px"></div>
      </div>
      <div class="group">
        <h3 class="sec-h">晶形</h3>
        <div class="row">
          <input id="formIn" class="in grow" placeholder="{hkl}，例如 111">
          <button class="btn pri" id="formAdd">加入</button>
        </div>
        <div class="forms" id="formList" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span class="lab" id="formTotal"></span>
          <label class="swl"><input type="checkbox" class="sw" id="symSw"> 對稱要素</label>
        </div>
      </div>
    </div>
  </aside>
</main>

<script>
'use strict';
/* ---------- 數學 ---------- */
const D2R=Math.PI/180,R2D=180/Math.PI;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vlen=a=>Math.hypot(a[0],a[1],a[2]),unit=a=>{const n=vlen(a);return n<1e-12?[0,0,1]:[a[0]/n,a[1]/n,a[2]/n];},neg=a=>[-a[0],-a[1],-a[2]];
function normPhi(p){p=((p+180)%360+360)%360-180;return p<=-180+1e-9?180:p;}
function fromPR(phi,rho){const p=phi*D2R,r=rho*D2R;return [Math.sin(r)*Math.sin(p),Math.sin(r)*Math.cos(p),Math.cos(r)];}
function toPR(v){v=unit(v);const h=Math.hypot(v[0],v[1]);return {phi:h<1e-9?0:normPhi(Math.atan2(v[0],v[1])*R2D),rho:Math.acos(clamp(v[2],-1,1))*R2D};}
function angDeg(a,b){return Math.acos(clamp(dot(unit(a),unit(b)),-1,1))*R2D;}
function rodr(v,k,deg){k=unit(k);const t=deg*D2R,c=Math.cos(t),s=Math.sin(t);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)));}
function perp(a){return Math.abs(a[2])<0.9?unit(cross(a,[0,0,1])):unit(cross(a,[1,0,0]));}
function upper(v){return v[2]<-1e-12?neg(v):v;}
function slerp(a,b,t){const w=angDeg(a,b)*D2R;if(w<1e-9)return a;const s=Math.sin(w);return unit(add(mul(a,Math.sin((1-t)*w)/s),mul(b,Math.sin(t*w)/s)));}
function dipPoint(p){p=upper(unit(p));if(Math.hypot(p[0],p[1])<1e-9)return [0,1,0];return upper(unit(cross(cross(p,[0,0,1]),p)));}
const M3={
  rot(k,deg){k=unit(k);const t=deg*D2R,c=Math.cos(t),s=Math.sin(t),C=1-c,[x,y,z]=k;return [[c+x*x*C,x*y*C-z*s,x*z*C+y*s],[y*x*C+z*s,c+y*y*C,y*z*C-x*s],[z*x*C-y*s,z*y*C+x*s,c+z*z*C]];},
  mul(A,B){return A.map(r=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));},
  vec(A,v){return [dot(A[0],v),dot(A[1],v),dot(A[2],v)];},
  neg(A){return A.map(r=>r.map(x=>-x));},I(){return [[1,0,0],[0,1,0],[0,0,1]];},
  mirror(n){n=unit(n);return [0,1,2].map(i=>[0,1,2].map(j=>(i===j?1:0)-2*n[i]*n[j]));},
  det(A){return dot(A[0],cross(A[1],A[2]));},key(A){return A.map(r=>r.map(x=>Math.round(x*1e4)+0).join(',')).join(';');}
};
function parseAng(s){if(typeof s==='number')return s;s=String(s||'').trim();if(!s)return NaN;
  s=s.replace(/(\d)½/g,'$1.5').replace(/½/g,'0.5').replace(/[−–]/g,'-');const ng=/^-/.test(s);const n=s.match(/\d+(?:\.\d+)?/g);if(!n)return NaN;
  let v=+n[0];if(n[1]!=null)v+=n[1]/60;if(n[2]!=null)v+=n[2]/3600;return ng?-v:v;}
function fmtDM(d){const sg=d<0?'−':'';d=Math.abs(d);let D=Math.floor(d),m=Math.round((d-D)*600)/10;if(m>=60){D++;m=0;}return `${sg}${D}°${m<10?'0':''}${m.toFixed(1).replace(/\.0$/,'')}′`;}
function f1(d){return (Math.abs(d)<0.05?0:d).toFixed(1).replace('-','−')+'°';}
function fPR(v){const {phi,rho}=toPR(v);return `(${f1(phi)}, ${f1(rho)})${rho>90+1e-6?' 下半球':''}`;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 晶體學 ---------- */
const SYS={
  cubic:{name:'等軸晶系',pgs:['23','m-3','432','-43m','m-3m'],fields:[],def:{a:1,b:1,c:1,al:90,be:90,ga:90}},
  tetragonal:{name:'正方晶系',pgs:['4','-4','4/m','422','4mm','-42m','4/mmm'],fields:['c'],def:{a:1,b:1,c:1,al:90,be:90,ga:90}},
  orthorhombic:{name:'斜方晶系',pgs:['222','mm2','mmm'],fields:['a','c'],def:{a:1,b:1,c:1,al:90,be:90,ga:90}},
  hexagonal:{name:'六方晶系',pgs:['6','-6','6/m','622','6mm','-6m2','6/mmm'],fields:['c'],def:{a:1,b:1,c:1,al:90,be:90,ga:120},hex:true},
  trigonal:{name:'三方晶系',pgs:['3','-3','32','3m','-3m'],fields:['c'],def:{a:1,b:1,c:1,al:90,be:90,ga:120},hex:true},
  monoclinic:{name:'單斜晶系',pgs:['2','m','2/m'],fields:['a','c','be'],def:{a:1,b:1,c:1,al:90,be:105,ga:90}},
  triclinic:{name:'三斜晶系',pgs:['1','-1'],fields:['a','c','al','be','ga'],def:{a:1,b:1,c:1,al:95,be:100,ga:85}}
};
const PG={'1':[],'-1':['i'],'2':['2y'],'m':['my'],'2/m':['2y','i'],'222':['2x','2y'],'mm2':['mx','my'],'mmm':['2x','2y','i'],

const RN=300;

function paramsToLat(sys,x){switch(sys){case 'tetragonal':return {a:1,b:1,c:Math.exp(x[0]),al:90,be:90,ga:90};case 'hexagonal':case 'trigonal':return {a:1,b:1,c:Math.exp(x[0]),al:90,be:90,ga:120};
  case 'orthorhombic':return {a:Math.exp(x[0]),b:1,c:Math.exp(x[1]),al:90,be:90,ga:90};case 'monoclinic':return {a:Math.exp(x[0]),b:1,c:Math.exp(x[1]),al:90,be:x[2],ga:90};}return {a:1,b:1,c:1,al:90,be:90,ga:90};}
function objective(sys,x,cons){const B=buildLat(paramsToLat(sys,x));let s=0;
  for(const c of cons){if(c.type==='ang'){const d=angDeg(gvec(B,c.h1),gvec(B,c.h2))-c.val;s+=d*d;}else{const pr=toPR(gvec(B,c.h1));if(isFinite(c.phi)){const d=normPhi(pr.phi-c.phi);s+=d*d;}if(isFinite(c.rho)){const d=pr.rho-c.rho;s+=d*d;}}}
  if(sys==='monoclinic'&&(x[2]<90||x[2]>150))s+=1e4;return s;}
function nelderMead(f,x0,step,it=900){const n=x0.length;let P=[x0.slice()];for(let i=0;i<n;i++){const p=x0.slice();p[i]+=step[i];P.push(p);}let F=P.map(f);
  for(let k=0;k<it;k++){const ix=P.map((_,i)=>i).sort((a,b)=>F[a]-F[b]);P=ix.map(i=>P[i]);F=ix.map(i=>F[i]);if(Math.abs(F[n]-F[0])<1e-14&&k>50)break;
    const c=new Array(n).fill(0);for(let i=0;i<n;i++)for(let j=0;j<n;j++)c[j]+=P[i][j]/n;const xr=c.map((v,j)=>2*v-P[n][j]),fr=f(xr);
    if(fr<F[0]){const xe=c.map((v,j)=>3*v-2*P[n][j]),fe=f(xe);if(fe<fr){P[n]=xe;F[n]=fe;}else{P[n]=xr;F[n]=fr;}}else if(fr<F[n-1]){P[n]=xr;F[n]=fr;}
    else{const xc=c.map((v,j)=>(v+P[n][j])/2),fc=f(xc);if(fc<F[n]){P[n]=xc;F[n]=fc;}else for(let i=1;i<=n;i++){P[i]=P[i].map((v,j)=>(P[0][j]+v)/2);F[i]=f(P[i]);}}}
  let b=0;for(let i=1;i<=n;i++)if(F[i]<F[b])b=i;return {x:P[b],f:F[b]};}
function solve(sys,rows){const cons=rows.map(r=>r[0]==='ang'?{type:'ang',h1:to3(parseIdx(r[1])),h2:to3(parseIdx(r[2])),val:parseAng(r[3])}:{type:'co',h1:to3(parseIdx(r[1])),phi:parseAng(r[2]),rho:parseAng(r[3])});
  const R=[-0.9,-0.3,0.3,0.9],st=[];if(sys==='orthorhombic')for(const a of R)for(const c of R)st.push([a,c]);else if(sys==='monoclinic')for(const a of R)for(const c of R)for(const b of [95,110,125])st.push([a,c,b]);else for(const a of [-1.5,-0.7,0,0.7,1.5])st.push([a]);
  let best=null;for(const x0 of st){const sp=x0.map((_,i)=>i<2?0.25:4);let r=nelderMead(x=>objective(sys,x,cons),x0,sp);r=nelderMead(x=>objective(sys,x,cons),r.x,sp.map(v=>v/10));if(!best||r.f<best.f)best=r;}
  return paramsToLat(sys,best.x);}

   {t:'軸長比',n:'tan ρ(101) = c/a。',a:'a : c = 1 : 0.537',async run(c){const L=solve('tetragonal',DATA.t3);c.reset('tetragonal',L,'4/mmm');for(const h of ['001','100','110','111','101','331'])c.form(h);c.view('net');}}]},
 {id:'t4',group:'Test',title:'Test 4　磷酸鹽礦物（正方）',given:'(001) (0°, 0°)　(211) (63°26′, 62°57′)　(121) (26°34′, 62°57′)',steps:[
   {t:'標出三個面',async run(c){c.reset('tetragonal');c.pt('(001)',0,0,{color:0});c.pt('(211)',"63°26'","62°57'",{color:1});c.pt('(121)',"26°34'","62°57'",{color:1});c.view('net');}},
   {t:'面角',n:'轉描圖紙讓 (211)、(121) 落在網的同一條經線上。',a:'(001)∧(211) = 62°57′　(211)∧(121) = 32.7°',async run(c){c.reset('tetragonal');c.pt('(001)',0,0,{color:0});const a=c.pt('(211)',"63°26'","62°57'",{color:1}),b=c.pt('(121)',"26°34'","62°57'",{color:1});c.view('net');const g=c.gc2(a,b,'',{color:1,dash:true});await c.net(alignGC(g.v));c.arc(a,b);}},
   {t:'軸長比',n:'tan ρ(211) = (c/a)·√5。',a:'a : c = 1 : 0.876',async run(c){const L=solve('tetragonal',DATA.t4);c.reset('tetragonal',L,'4/mmm');const o=c.face('001','',{color:0});c.form('211',{color:1});const f=c.face('210','',{color:5});c.gc2(o,f,'',{color:5,dash:true});c.view('net');}}]},
 {id:'t5',group:'Test',title:'Test 5　FeS₂（斜方）',given:'(010)∧(130) 22°08′　(101)∧(1̄01) 74°38′　(001)∧(111) 44°34′',steps:[
   {t:'(130)：a/b',n:'tan 22°08′ = b/(3a)。',a:'a/b = 0.819',async run(c){c.reset('orthorhombic');const b=c.pt('(010)',0,90,{color:0});c.pt('(001)',0,0,{color:0});const p=c.pt('(130)',"22°08'",90,{color:1});c.arc(b,p);c.view('net');}},
   {t:'(101)：c/a',n:'(101)、(1̄01) 各離 (001) 37°19′，tan 37°19′ = c/a。',a:'c/b = 0.625',async run(c){c.reset('orthorhombic');c.pt('(010)',0,90,{color:0});c.pt('(001)',0,0,{color:0});c.pt('(130)',"22°08'",90,{color:1});const p=c.pt('(101)',90,"37°19'",{color:1}),q=c.pt('(1̄01)',-90,"37°19'",{color:1});c.arc(p,q);c.view('net');}},
   {t:'驗算並畫出全部晶面',n:'用算出的軸長比畫 (111)，量它與 (001) 的夾角。',a:'a : b : c = 0.819 : 1 : 0.625，共 20 面',async run(c){const L=solve('orthorhombic',DATA.t5);c.reset('orthorhombic',L,'mmm');for(const h of ['010','001','130','101','111'])c.form(h);
     const o=S.items.find(i=>i.hkl&&i.hkl.join()==='0,0,1'),y=S.items.find(i=>i.hkl&&i.hkl.join()==='1,1,1');c.arc(o,y,{color:5});c.view('net');}}]},
 {id:'t6',group:'Test',title:'Test 6　方解石（3̄ 2/m）',given:'(101̄0) (90°, 90°)　(112̄0) (60°, 90°)　(101̄1) (90°, 44°36′)　(011̄2) (30°, 26°15′)',steps:[
   {t:'標出四個面',n:'六方軸：a₂ 在東（Φ = 0°），a₁ 在 Φ = 120°。',async run(c){c.reset('trigonal');c.pt('(101̄0)',90,90,{color:0});c.pt('(112̄0)',60,90,{color:0});c.pt('(101̄1)',90,"44°36'",{color:1});c.pt('(011̄2)',30,"26°15'",{color:2});c.view('net');}},
   {t:'軸長比與全部晶面',n:'tan ρ(101̄1) = (c/a)·2/√3。',a:'a : c = 1 : 0.854，共 24 個面極',async run(c){const L=solve('trigonal',DATA.t6);c.reset('trigonal',L,'-3m');for(const h of ['10-10','11-20','10-11','01-12'])c.form(h);c.sym(true);c.view('net');}}]},
 {id:'t7',group:'Test',title:'Test 7　正長石（單斜 2/m）',given:'(110)∧(010) 59°24′　(110)∧(001) 67°47′　(001)∧(1̄01) 50°17′',steps:[
   {t:'(010)、(110)',n:'(110) 在基圓上，離 (010) 59°24′。',async run(c){c.reset('monoclinic');const b=c.pt('(010)',0,90,{color:0});const m=c.pt('(110)',"59°24'",90,{color:1});c.arc(b,m);c.view('net');}},
   {t:'(001)：β',n:'以 (110) 畫 67°47′ 小圓，交 Φ = 90° 直徑；偏離圓心 β − 90°。',a:'β = 116°04′',async run(c){c.reset('monoclinic');const b=c.pt('(010)',0,90,{color:0});const m=c.pt('(110)',"59°24'",90,{color:1});const s=c.sc(m,"67°47'",{color:2});const g=c.gcP(b,'',{color:6,dash:true});
     const xs=c.scgx(s,g,{color:0});c.keep(xs,xs.find(v=>v.v[2]>0)).label='(001)';c.view('net');}},
   {t:'(1̄01)',n:'在圓心另一側，離 (001) 50°17′。',a:'(−90°, 24.2°)',async run(c){c.reset('monoclinic');c.pt('(010)',0,90,{color:0});c.pt('(110)',"59°24'",90,{color:1});const o=c.pt('(001)',90,26.07,{color:0});const q=addPoint(rodr(o.v,[0,1,0],-50.283),'(1̄01)',{color:5});c.arc(o,q,{color:5});c.view('net');}},
   {t:'軸長比與全部晶面',n:'依 2/m 對稱畫出所有面。',a:'a : b : c = 0.658 : 1 : 0.555，共 10 面',async run(c){const L=solve('monoclinic',DATA.t7);c.reset('monoclinic',L,'2/m');for(const h of ['010','110','001','-101'])c.form(h);c.sym(true);c.view('net');}}]}
];
const exSel=document.getElementById('exSel');
exSel.innerHTML=[...new Set(EX.map(e=>e.group))].map(g=>`<optgroup label="${g}">${EX.filter(e=>e.group===g).map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}</optgroup>`).join('');
exSel.addEventListener('change',()=>openEx(exSel.value,0));
function openEx(id,k,anim=true){ex.cur=EX.find(e=>e.id===id);exSel.value=id;document.getElementById('exTitle').textContent=ex.cur.title;const gv=document.getElementById('exGiven');gv.textContent=ex.cur.given;gv.hidden=!ex.cur.given;goStep(k,anim);}
async function goStep(k,anim){const e=ex.cur;k=clamp(k,0,e.steps.length-1);ex.step=k;const token=++ex.token;animToken++;const st=e.steps[k];
  document.getElementById('exSteps').innerHTML=e.steps.map((s,i)=>`<li data-st="${i}" class="${i<k?'done':i===k?'cur':''}"><span class="n">${i<k?'✓':i+1}</span>${esc(s.t)}</li>`).join('');
  const nt=document.getElementById('exNote');nt.textContent=st.n||'';nt.hidden=!st.n;
  const a=document.getElementById('exAns');a.hidden=!st.a;a.innerHTML=st.a?`<b>答案</b>${esc(st.a)}`:'';
  document.getElementById('exPrev').disabled=k===0;document.getElementById('exNext').disabled=k===e.steps.length-1;
  try{snap();await st.run(ctx(anim,token));}catch(err){if(err instanceof Cancel)return;console.error(err);}
  if(token!==ex.token)return;S.sel=S.sel.filter(id=>byId(id));syncCrystal();syncRot();sync3d();renderAll();}
document.getElementById('exSteps').addEventListener('click',e=>{const li=e.target.closest('[data-st]');if(li)goStep(+li.dataset.st,true);});
document.getElementById('exPrev').addEventListener('click',()=>goStep(ex.step-1,true));
document.getElementById('exNext').addEventListener('click',()=>goStep(ex.step+1,true));

/* ---------- 晶體面板 ---------- */
const sysSel=document.getElementById('sysSel'),pgSel=document.getElementById('pgSel');
sysSel.innerHTML=Object.entries(SYS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
const relB=()=>S.sys==='orthorhombic'||S.sys==='monoclinic'||S.sys==='triclinic';
function syncCrystal(){sysSel.value=S.sys;pgSel.innerHTML=SYS[S.sys].pgs.map(p=>`<option value="${p}">${PGNAME[p]}</option>`).join('');pgSel.value=S.pg;
  const f=SYS[S.sys].fields,el=document.getElementById('latInputs');el.hidden=!f.length;
  el.innerHTML=f.map(k=>{const v=k==='a'?S.lat.a/S.lat.b:k==='c'?(relB()?S.lat.c/S.lat.b:S.lat.c/S.lat.a):S.lat[k];
    const lab={a:'a/b',c:relB()?'c/b':'c/a',al:'α',be:'β',ga:'γ'}[k];
    return `<span class="lab">${lab}</span><input class="in w-m" data-lat="${k}" value="${k.length===2?fmtDM(v):(+v.toFixed(4))}">`;}).join('');
  renderForms();}
function renderForms(){const fl=document.getElementById('formList');fl.innerHTML=S.forms.map(f=>`<div class="f"><span class="dot" style="background:${cvar(f.color)}"></span><span class="nm">${idxHTML(f.hkl,'{}')}<small>${esc(f.name)}${f.name?' · ':''}${f.n} 面</small></span><button class="x" data-fx="${f.id}" aria-label="移除">×</button></div>`).join('');
  fl.hidden=!S.forms.length;const t=S.forms.reduce((a,f)=>a+f.n,0);document.getElementById('formTotal').textContent=S.forms.length?`共 ${t} 面`:'依點群畫出所有對稱等效面';
  document.getElementById('symSw').checked=S.showSym;}
sysSel.addEventListener('change',()=>{snap();S.sys=sysSel.value;S.pg=SYS[S.sys].pgs.at(-1);S.latp={...SYS[S.sys].def};setLat();refreshFaces();syncCrystal();renderAll();});
pgSel.addEventListener('change',()=>{snap();S.pg=pgSel.value;refreshFaces();syncCrystal();renderAll();});
document.getElementById('latInputs').addEventListener('change',e=>{const k=e.target.dataset.lat;if(!k)return;const v=k.length===2?parseAng(e.target.value):parseFloat(e.target.value);if(!(v>0))return syncCrystal();
  snap();const L={...S.lat};if(k==='a')L.a=v*L.b;else if(k==='c')L.c=v*(relB()?L.b:L.a);else L[k]=v;S.latp=L;setLat();refreshFaces();syncCrystal();renderAll();});
document.getElementById('formAdd').addEventListener('click',()=>{const h=to3(parseIdx(document.getElementById('formIn').value));if(!h)return;snap();addForm(h);syncCrystal();renderAll();});
document.getElementById('formIn').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('formAdd').click();});
document.getElementById('formList').addEventListener('click',e=>{const b=e.target.closest('[data-fx]');if(!b)return;snap();S.forms=S.forms.filter(f=>f.id!==b.dataset.fx);S.items=S.items.filter(i=>i.form!==b.dataset.fx);S.sel=S.sel.filter(x=>byId(x));syncCrystal();renderAll();});
document.getElementById('symSw').addEventListener('change',e=>{S.showSym=e.target.checked;renderOverlay();});

/* ---------- 作圖面板 ---------- */
function renderResult(){document.getElementById('result').innerHTML=S.log.length?S.log.map(h=>`<div>${h}</div>`).join(''):'<div class="muted">在圖上點選點或線，再按作圖。</div>';}
function renderTiles(){const {pts,gcs,scs}=selK();const ok={gc2:pts.length>=2,angle:pts.length>=2,zone:pts.length>=2,gcOfPole:pts.length>=1,sc:pts.length>=1,x:scs.length>=2||(scs.length&&gcs.length)||gcs.length>=2,anti:pts.length>=1,toPrim:pts.length>=2,rotate:pts.length>=1};
  document.querySelectorAll('[data-act]').forEach(b=>b.disabled=!ok[b.dataset.act]);
  document.getElementById('selHint').textContent=S.sel.length?`· 已選 ${S.sel.length} 個`:'· 先在圖上點選';}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>ACT[b.dataset.act]()));
document.getElementById('ptAdd').addEventListener('click',()=>{const p=parseAng(document.getElementById('ptPhi').value),r=parseAng(document.getElementById('ptRho').value);if(!isFinite(p)||!isFinite(r)||r<0||r>180)return;
  snap();const it=addPoint(fromPR(p,r),document.getElementById('ptLab').value.trim()||undefined);log(`<b>${esc(it.label)}</b> ${fPR(it.v)}`);document.getElementById('ptLab').value='';renderAll();});
['ptLab','ptPhi','ptRho'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ptAdd').click();}));
document.getElementById('hklAdd').addEventListener('click',()=>{const h=to3(parseIdx(document.getElementById('hklIn').value));if(!h)return log('<span class="muted">指數格式例如 111、1-10、10-11。</span>');snap();const it=addFace(h,'');log(`<b>${nameHTML(it)}</b> ${fPR(it.v)}`);renderAll();});
document.getElementById('hklIn').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('hklAdd').click();});
function delSel(){if(!S.sel.length)return;snap();const s=new Set(S.sel);S.items=S.items.filter(i=>!s.has(i.id));S.sel=[];renderAll();}
document.getElementById('delSel').addEventListener('click',delSel);

/* ---------- 視圖、總渲染 ---------- */
function setView(v){S.view=v;document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  document.getElementById('wrapNet').hidden=v!=='net';document.getElementById('barNet').hidden=v!=='net';document.getElementById('wrap3d').hidden=v!=='3d';document.getElementById('bar3d').hidden=v!=='3d';
  if(v==='3d')render3D();else renderNet();}
function sync3d(){document.querySelectorAll('[data-o3]').forEach(cb=>cb.checked=V3.o[cb.dataset.o3]);}
document.getElementById('viewSeg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view);});
document.getElementById('paneSeg').addEventListener('click',e=>{const b=e.target.closest('[data-pane]');if(!b)return;document.querySelectorAll('#paneSeg button').forEach(x=>x.setAttribute('aria-selected',x===b));
  for(const p of ['ex','con','cry'])document.getElementById('pane-'+p).hidden=p!==b.dataset.pane;});
function renderAll(){renderNet();renderTiles();renderStatus();renderResult();renderForms();if(S.view==='3d')render3D();}
const rr=document.getElementById('netRot');rr.addEventListener('input',()=>{S.netRot=+rr.value;document.getElementById('netRotVal').textContent=rotTxt(S.netRot);renderOverlay();renderStatus();});
document.getElementById('netAlign').addEventListener('click',()=>{const {pts,gcs}=selK();
  if(gcs.length)setNetRot(alignGC(gcs[0].v),true);else if(pts.length>=2){const p=cross(pts[0].v,pts[1].v);if(vlen(p)>1e-9)setNetRot(alignGC(unit(p)),true);}else if(pts.length===1)setNetRot(alignPt(pts[0].v),true);});
document.getElementById('clickAdd').addEventListener('change',e=>{S.clickAdd=e.target.checked;});
document.querySelectorAll('[data-o3]').forEach(cb=>cb.addEventListener('change',()=>{V3.o[cb.dataset.o3]=cb.checked;render3D();}));
document.getElementById('v3top').addEventListener('click',()=>{V3.yaw=0;V3.pitch=90;render3D();});
document.getElementById('v3def').addEventListener('click',()=>{V3.yaw=-32;V3.pitch=20;render3D();});
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('clearBtn').addEventListener('click',()=>{snap();S.items=[];S.forms=[];S.sel=[];S.log=[];syncCrystal();renderAll();});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
  else if(e.key==='Escape'){S.sel=[];renderAll();}else if((e.key==='Delete'||e.key==='Backspace')&&S.sel.length){e.preventDefault();delSel();}});
new ResizeObserver(()=>{if(S.view==='net')renderNet();else render3D();}).observe(document.querySelector('.stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render3D);
new MutationObserver(render3D).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

syncCrystal();openEx('ang',0,false);
window.WT={S,EX,goStep,openEx,setView};
</script>
